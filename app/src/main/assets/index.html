<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fb">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>架空鉄道ダイヤ工房</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="架空鉄道ダイヤ工房">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <span><b>DIA LAB</b><small>架空鉄道ダイヤ工房</small></span>
      </div>
      <button class="icon-button" id="openData" aria-label="データの入出力" title="データの入出力">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 14v5h14v-5"/></svg>
      </button>
    </header>

    <main>
      <section class="page active" id="page-lines" data-page="lines">
        <div class="section-head">
          <div><span class="eyebrow">NETWORK</span><h1>路線を設計</h1></div>
          <button class="primary small" id="newLine">＋ 新しい路線</button>
        </div>
        <div class="line-tabs" id="lineTabs" aria-label="路線の選択"></div>
        <div id="lineEditor"></div>
      </section>

      <section class="page" id="page-stations" data-page="stations">
        <div class="section-head">
          <div><span class="eyebrow">STATIONS</span><h1>駅と停車パターン</h1></div>
          <button class="primary small" id="addStation">＋ 駅を追加</button>
        </div>
        <div class="hint-card">
          <span class="hint-icon">種別</span>
          <p>駅順と駅間距離に加え、選択停車する各列車種別の停車駅を設定できます。</p>
        </div>
        <div class="station-list" id="stationList"></div>
      </section>

      <section class="page" id="page-generate" data-page="generate">
        <div class="section-head">
          <div><span class="eyebrow">GENERATOR</span><h1>運行条件を設定</h1></div>
        </div>
        <div id="generatorEditor"></div>
      </section>

      <section class="page timetable-page" id="page-timetable" data-page="timetable">
        <div class="section-head timetable-head">
          <div><span class="eyebrow">TIMETABLE</span><h1>生成ダイヤ</h1></div>
          <button class="secondary small" id="exportCsv">CSV</button>
        </div>
        <div id="timetableControls"></div>
        <div id="timetable"></div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="メインメニュー">
      <button class="active" data-nav="lines">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18V7l7-3 7 3v11M8 18v2m8-2v2M8 9h8M8 13h8M4 18h16"/></svg>
        <span>路線</span>
      </button>
      <button data-nav="stations">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="3"/><path d="M12 10v10M5 14h14M7 20h10"/></svg>
        <span>駅</span>
      </button>
      <button data-nav="generate">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h3M13 12h3M8 16h3M13 16h3"/></svg>
        <span>生成</span>
      </button>
      <button data-nav="timetable">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>
        <span>時刻表</span>
      </button>
    </nav>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-handle"></div>
      <div class="modal-head">
        <div><span class="eyebrow" id="modalEyebrow">DATA</span><h2 id="modalTitle">データの入出力</h2></div>
        <button class="icon-button" id="closeModal" aria-label="閉じる">×</button>
      </div>
      <div id="modalContent"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
